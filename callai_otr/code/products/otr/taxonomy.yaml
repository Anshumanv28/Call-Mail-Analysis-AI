    - hello sunai de raha hai
  - id: repeated_call_follow_up
    name: Repeated Call / Follow-up
    description: 'Caller has already called or emailed about the same issue and is following up on it — asking whether
      their mail was received or acted on, why there is no reply yet, or repeating the same unresolved query; also
      repeat calls where noise/no response means the query still cannot be captured. NOT: a first-time request to
      be called back -> use `call_back_request`; a formal grievance about the portal or process -> use `complaint_against_portal_process`.'

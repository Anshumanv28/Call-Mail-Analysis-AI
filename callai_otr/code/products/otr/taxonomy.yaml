issues:
- id: registration_and_portal
  name: Registration & Portal
  description: Registration, login, OTP, password, portal navigation, application form, technical issues, submission,
    application status, correction window.
  sub_issues:
  - id: fresh_registration_query
    name: Fresh Registration Query
    description: 'Caller has not registered yet and asks how to create a new OTR — which portal, what details and
      documents are needed, whether a fresh OTR is required for this exam (Super TET, PGT, TGT, UPTET vacancy).
      NOT: already has an OTR and asks whether a second one is needed -> use duplicate_registration_concern; asks
      whether one OTR covers several exams -> use otr_vs_exam_application_confusion; asks how to fill the exam form
      once OTR exists -> use how_to_apply_for_exam_after_otr.'
    cues:
    - naya OTR kaise banayein
    - registration karna hai, process bata dijiye
    - pehli baar apply kar raha hoon
    - OTR banane ke liye kya kya chahiye
    - Super TET ke liye naya OTR karna padega
    - nayi registration ki website kaun si hai
    - registration kahan se start hota hai
  - id: duplicate_registration_concern
    name: Duplicate Registration Concern
    description: 'Caller already has an OTR (often an old UPTET one) and is worried about making or having made
      a second one — two OTR IDs created by accident, system says already registered, or asks whether a duplicate
      OTR with the same Aadhaar/details is allowed. NOT: only asking whether the existing OTR is valid for a different
      exam or how OTR relates to the exam form -> use otr_vs_exam_application_confusion; already has two live accounts
      and asks which one to use or how to deactivate one -> use multiple_otr_accounts_issue.'
    cues:
    - do OTR ban gaye galti se
    - dobara OTR banaye to already registered aa raha hai
    - purana UPTET ka OTR chal nahi raha, naya banana padega kya
    - same Aadhaar se dusra OTR ban jayega
    - ek hi naam se do registration ho gaya
    - naya OTR banaun ya purana hi use karun
    - duplicate registration ho gayi hai
  - id: otr_vs_exam_application_confusion
    name: OTR vs Exam Application Confusion
    description: 'Caller does not understand the difference between the one-time OTR profile and the exam-specific
      application form — asks whether one OTR works for multiple exams or both subjects, whether the old OTR is
      still valid for a new exam, or says OTR is done but the exam still shows not registered. NOT: worried about
      having created or needing a second OTR -> use duplicate_registration_concern; asks the steps to fill the exam
      form after OTR -> use how_to_apply_for_exam_after_otr.'
    cues:
    - OTR ho gaya hai, form alag se bharna hota hai kya
    - ek OTR se do exam apply ho jayenge
    - purana OTR is exam me valid hai ya nahi
    - OTR kar liya par PGT bol raha hai registered nahi ho
    - OTR aur application form me kya antar hai
    - Super TET ke liye alag OTR chahiye
    - do subject ke liye ek hi OTR chalega
  - id: resume_incomplete_application
    name: Resume Incomplete Application
    description: 'Caller had started the OTR or exam form, left it part-filled (refresh, closed browser, dropped
      connection) and asks how to log back in and continue from where it stopped, or says the form is stuck and
      not moving ahead. NOT: a section refuses to save when clicking save/continue -> use application_form_section_not_saving;
      logged out mid-form by inactivity -> use session_timeout_issue.'
    cues:
    - form adha bhar gaya tha, aage kaise badhaun
    - refresh ho gaya, data bhar dobara bharna padega
    - incomplete form dikha raha hai
    - wahi se continue kaise karun
    - form beech me chhoot gaya
    - application aage nahi badh raha
    - draft save tha, ab kahan milega
  - id: offline_application_query
    name: Offline Application Query
    description: 'Caller asks whether the form can be filled on paper or submitted offline — by post, at a district
      office or a cyber cafe/Jan Seva Kendra — instead of on the portal, or where to get a printed form. NOT: asking
      the general mode/steps of applying online -> use application_mode_query.'
    cues:
    - offline form bhar sakte hain kya
    - hard copy kahan jama karni hai
    - post se bhejna hoga
    - jan seva kendra se ho jayega
    - office jaakar form de sakte hain
    - sirf online hi hota hai kya
    - printed form kahan milega
  - id: portal_not_loading_technical_error
    name: Portal Not Loading / Technical Error
    description: 'Caller cannot get the website or a page to open at all, or hits a generic technical failure —
      site down, blank page, server error, page hangs, options/dropdowns simply not rendering, works on no device.
      NOT: the form opens but a section refuses to save -> use application_form_section_not_saving; submit/create-account
      errors on submission -> use registration_form_submission_error; final submit/lock hangs -> use otr_final_submit_button_issue.'
    cues:
    - website khul hi nahi rahi
    - site down hai subah se
    - server error aa raha hai
    - page blank aa raha hai
    - do-teen mobile me try kiya, nahi chala
    - portal me option hi load nahi ho raha
    - site slow hai, hang ho jati hai
    - technical problem aa rahi hai portal me
  - id: registration_form_submission_error
    name: Registration Form Submission Error
    description: 'Caller fills the registration/OTR form but submission itself throws an error or fails — create
      account button does nothing, page refreshes back, server/connectivity error on submit, a mandatory field will
      not accept a valid value so the form cannot be submitted, status stays in progress. NOT: form already submitted
      and caller now wants a field changed -> use how_to_edit_saved_otr_data; the final review-and-lock step hangs
      -> use otr_final_submit_button_issue; whole site will not open -> use portal_not_loading_technical_error.'
    cues:
    - submit karne par error aa raha hai
    - create account button kaam nahi kar raha
    - page refresh ho jata hai submit pe
    - registration submit hi nahi ho raha
    - mandatory field accept nahi kar raha
    - in progress hi dikha raha hai
    - server error aa jata hai form bharte waqt
  - id: multiple_otr_accounts_issue
    name: Multiple OTR Accounts Issue
    description: 'Caller already has two or more OTR accounts/IDs live and asks which one to use going forward,
      whether the second one is valid, how to deactivate or merge the first, or which OTR the admit card will come
      from. NOT: only afraid of creating a duplicate or told already registered -> use duplicate_registration_concern;
      asks whether one OTR covers several exams -> use otr_vs_exam_application_confusion.'
    cues:
    - do OTR ID hai, kaunsa use karun
    - pehla OTR band karwana hai
    - dusra OTR valid rahega kya
    - admit card kis OTR se aayega
    - do account ban gaye, merge ho jayenge
    - purana OTR deactivate kaise ho
    - dono OTR me details alag hai
  - id: otr_id_not_received_after_registration
    name: OTR ID Not Received After Registration
    description: 'Caller completed registration but never got the OTR ID/number — no SMS or email with it, or the
      portal now says OTR not found / already registered so they can neither recover nor re-register. NOT: caller
      once knew the OTR ID and has simply forgotten or lost it -> use otr_id_forgotten_recovery; expecting the registration
      acknowledgement mail/message generally -> use registration_confirmation_not_received.'
    cues:
    - OTR number aaya hi nahi
    - registration ho gaya par ID nahi mili
    - OTR not found bata raha hai
    - already registered bol raha hai par ID nahi hai
    - message me OTR ID nahi aaya
    - registration ke baad kuch nahi mila
    - ID generate hui hai ya nahi pata nahi
  - id: registration_confirmation_not_received
    name: Registration Confirmation Not Received
    description: 'Caller wants the confirmation of registration itself — acknowledgement SMS or email, login credentials/roll
      number and password — which never arrived, and asks whether the registration actually went through. NOT: the
      OTR ID number specifically is missing -> use otr_id_not_received_after_registration; the OTR profile lock/submission
      acknowledgement is missing -> use otr_submission_confirmation_not_received; correction-window acknowledgement
      missing -> use amendment_confirmation_not_received.'
    cues:
    - confirmation mail nahi aaya
    - registration ka message nahi mila
    - pata nahi registration hua ya nahi
    - roll number aur password nahi aaya
    - koi acknowledgement nahi mila
    - mail check kiya, spam me bhi nahi hai
    - registered hua hai to confirm kar dijiye
  - id: apply_otr_link_not_visible_on_portal
    name: Apply / OTR Link Not Visible on Portal
    description: 'Caller is on the portal but the link/tile they need is not there — the Apply or OTR link, or the
      particular post''s form (PGT, TGT, Primary, Assistant Professor, Special TET) is not appearing, or an option
      like optional subject is not visible on the landing page. NOT: the whole site fails to open -> use portal_not_loading_technical_error;
      a dropdown inside an opened form has no values -> use district_state_dropdown_issue.'
    cues:
    - apply ka link dikh nahi raha
    - PGT ka form option nahi aa raha
    - primary teacher ka form kahan hai
    - OTR ka button nahi mil raha portal par
    - exam ka naam list me nahi hai
    - apply now option gayab hai
    - link kahan se milega, dhundh nahi paa raha
  - id: mobile_otp_not_received
    name: Mobile OTP Not Received
    description: 'Caller is not receiving the OTP SMS on their mobile during registration, login or verification
      — no message at all, on a particular operator, or repeatedly for days. NOT: OTP arrives but is refused or
      the OTP login errors out -> use otp_login_not_working; OTP arrives after it has lapsed -> use otp_expired_before_use;
      OTP goes to an old number -> use otp_coming_on_wrong_number; it is the Aadhaar eKYC OTP -> use aadhaar_otp_not_received.'
    cues:
    - OTP nahi aa raha mobile par
    - message hi nahi aata
    - OTP ka intezaar kar raha hoon, kuch nahi aaya
    - resend kiya phir bhi OTP nahi aaya
    - kai din se OTP nahi aa raha
    - SIM change kiya tab bhi nahi
    - mobile verify nahi ho pa raha OTP ke bina
  - id: email_otp_not_received
    name: Email OTP Not Received
    description: 'Caller is not getting the OTP/verification mail on their email, or it lands but the email verification
      step fails with a service error, so the email cannot be verified. NOT: the mobile SMS OTP is missing -> use
      mobile_otp_not_received; wants to change the email address in the profile -> use mobile_email_change_in_profile.'
    cues:
    - email par OTP nahi aaya
    - Gmail me mail nahi aa raha
    - mail OTP aa gaya par verify nahi ho raha
    - email verification fail ho raha hai
    - spam me bhi check kiya, nahi hai
    - service unavailable aa raha hai email verify pe
    - email verify kaise karun OTP ke bina
  - id: otp_expired_before_use
    name: OTP Expired Before Use
    description: 'Caller receives the OTP but it lapses before it can be used — arrives late, timer runs out, or
      entering it says OTP expired/invalid, forcing repeated resends. NOT: no OTP arrives at all -> use mobile_otp_not_received
      or email_otp_not_received; the OTP login page itself errors -> use otp_login_not_working.'
    cues:
    - OTP expire ho jata hai
    - OTP der se aata hai, tab tak time khatam
    - OTP invalid ya expired bata raha hai
    - timer khatam ho jata hai
    - har baar resend karna padta hai
    - OTP dalne se pehle hi expire
    - kitni der me OTP dalna hota hai
  - id: wrong_otp_entered_multiple_times
    name: Wrong OTP Entered Multiple Times
    description: 'Caller entered the OTP incorrectly several times and now asks about the consequence — attempts
      exhausted, resend blocked, or told to try later. NOT: the account is locked after failed password logins ->
      use too_many_failed_login_attempts or account_locked_blocked; OTP never arrives -> use mobile_otp_not_received.'
    cues:
    - galat OTP kai baar daal diya
    - attempt khatam ho gaye
    - ab OTP resend nahi ho raha
    - block ho gaya OTP galat dalne se
    - kitne baar try kar sakte hain
    - thodi der baad try kijiye aa raha hai
    - galti se galat OTP dal diya, ab kya karun
  - id: password_forgotten_reset
    name: Password Forgotten / Reset
    description: 'Caller has forgotten their portal password (or the security-question answer) and wants to reset
      it, or the forgot-password/reset flow itself is not working. NOT: the OTR ID/username is what is forgotten
      -> use otr_id_forgotten_recovery; account is blocked after failed attempts -> use account_locked_blocked;
      no OTP arrives for the reset -> use mobile_otp_not_received.'
    cues:
    - password bhool gaya hoon
    - password reset kaise karun
    - forgot password kaam nahi kar raha
    - security question ka answer yaad nahi
    - naya password ban hi nahi raha
    - login credentials match nahi kar rahe
    - purane OTR ka password reset nahi ho raha
  - id: captcha_not_loading_unclear
    name: CAPTCHA Not Loading / Unclear
    description: 'The captcha / security code box is blank, not loading or unreadable, so the caller cannot submit
      the login, registration or certificate-download page. NOT: the whole page fails to open -> use portal_not_loading_technical_error.'
    cues:
    - captcha dikh nahi raha
    - security code blank aa raha hai
    - captcha samajh nahi aa raha
    - code padha nahi ja raha
    - captcha refresh karne par bhi nahi aata
    - captcha galat bata raha hai
    - certificate page pe captcha load nahi ho raha
  - id: account_recovery_query
    name: Account Recovery Query
    description: 'Caller has lost access to the account as a whole and asks how to recover it — which recovery option
      exists, or says the account-recovery option is not visible on the OTR portal. NOT: only the password is forgotten
      -> use password_forgotten_reset; only the OTR ID is forgotten -> use otr_id_forgotten_recovery; the registered
      mobile is out of reach -> use registered_mobile_not_accessible.'
    cues:
    - account recover kaise karun
    - recovery ka option dikh nahi raha
    - account wapas kaise milega
    - sab details bhool gaya hoon
    - account access khatam ho gaya
    - recovery ke liye kya karna hoga
    - purana account wapas chahiye
  - id: otp_coming_on_wrong_number
    name: OTP Coming on Wrong Number
    description: 'The OTP is being delivered to a number the caller no longer uses or that belongs to someone else
      (cyber cafe, relative, old SIM), so they cannot complete verification. NOT: no OTP is delivered anywhere ->
      use mobile_otp_not_received; caller simply wants the registered number changed in the profile -> use mobile_email_change_in_profile;
      the registered number is theirs but unavailable -> use registered_mobile_not_accessible.'
    cues:
    - OTP dusre number par ja raha hai
    - cyber cafe wale ka number lag gaya tha
    - purane number par OTP aa raha hai
    - wo number band ho gaya hai
    - bhai ke number par OTP jata hai
    - galat number register ho gaya hai
    - mere number par OTP nahi, kisi aur ke par
  - id: category_change_after_form_submission
    name: Category Change After Form Submission
    description: 'Caller has already submitted/locked the OTR or exam form (often paid too) and reports the category
      or reservation flag is wrong — wrong caste, EWS/OBC wrongly chosen, disability shown as No — and asks how
      to change it now or whether the category option can still be picked. NOT: asking which category they are eligible
      for -> use ews_category, obc_category_and_creamy_layer or sc_st_category; asking specifically whether the
      correction window will permit category edits and how -> use category_correction_after_submission; the certificate
      format or date is the issue -> use ews_certificate_format_validity_query or category_certificate_date_validity_query.'
    cues:
    - category galat bhar gayi hai, form lock ho gaya
    - OBC ki jagah SC ho gaya
    - EWS select nahi hua tha, ab change karna hai
    - divyang ka option No aa raha hai, Yes karna hai
    - fees 1000 lag gayi, category badalni hai
    - submit ke baad category change ho sakti hai
    - caste galat hai OTR me, sudhar kaise hoga
  - id: permanent_address_entry_issue
    name: Permanent Address Entry Issue
    description: 'Caller is filling the permanent address / domicile part of the profile and asks what to enter
      or cannot enter it — married woman unsure whether to use parents'' or husband''s address, UP residency or
      domicile status field, a mandatory address-side field like tehsil telephone not available. NOT: form already
      submitted and the address must be corrected -> use address_correction_after_submission; the state/district
      dropdown has no values -> use district_state_dropdown_issue; asking whether they qualify for UP reservation
      -> use up_residency_and_reservation_eligibility.'
    cues:
    - permanent address me kya bharna hai
    - shaadi ke baad maike ka address ya sasural ka
    - domicile status kaise bharein
    - UP residency ka option kaise select karun
    - sthayi pata bhar nahi paa raha
    - tehsil ka telephone number maang raha hai
    - pati ka address dalna hai kya
  - id: correspondence_address_entry_issue
    name: Correspondence Address Entry Issue
    description: 'Caller asks what to fill in the correspondence/present address, whether it can differ from the
      permanent address or how to copy it, or cannot fill that block. NOT: the permanent address block -> use permanent_address_entry_issue;
      correcting address after submission -> use address_correction_after_submission.'
    cues:
    - correspondence address alag dal sakte hain
    - patra vyavhar ka pata kaun sa bharein
    - same as above ka option hai kya
    - abhi ka address different hai
    - correspondence address bhar nahi raha
    - kis address par letter aayega
    - dono address ek hi dalna hai kya
  - id: district_state_dropdown_issue
    name: District / State Dropdown Issue
    description: 'A dropdown in the form has no values or is missing the caller''s option — district or state not
      listed, Balak/Balika varg or second-language choice not appearing, category or post dropdown blank, so the
      field cannot be selected. NOT: the form section refuses to save -> use application_form_section_not_saving;
      board/university missing from its dropdown -> use board_university_not_in_dropdown; the appearing/passed option
      missing -> use appearing_option_missing_in_dropdown; already submitted and the missing option must now be
      fixed -> use what_fields_can_be_corrected.'
    cues:
    - district ka option aa hi nahi raha
    - dropdown khali hai
    - balika varg ka option nahi dikh raha
    - list me mera zila nahi hai
    - state select nahi ho raha
    - second language ka option missing hai
    - dropdown click karne par kuch nahi aata
  - id: village_ward_tehsil_not_found
    name: Village / Ward / Tehsil Not Found
    description: 'Caller''s village, ward, block or tehsil is not present in the address dropdown or is not accepted,
      so the address cannot be completed. NOT: the district/state level dropdown is blank -> use district_state_dropdown_issue;
      the pincode is refused -> use pincode_not_accepted.'
    cues:
    - gaon ka naam list me nahi hai
    - tehsil nahi mil raha dropdown me
    - ward ka option nahi aa raha
    - block select nahi ho raha
    - mera gram panchayat nahi dikh raha
    - kaun sa nazdeeki gaon chunein
    - village field khali hi reh jata hai
  - id: pincode_not_accepted
    name: Pincode Not Accepted
    description: 'The portal rejects the caller''s pincode as invalid or does not match it to their district, blocking
      the address section. NOT: the village/tehsil is missing from the list -> use village_ward_tehsil_not_found.'
    cues:
    - pincode accept nahi kar raha
    - pin code invalid bata raha hai
    - mera pincode district se match nahi ho raha
    - Amethi ka pincode nahi le raha
    - 6 digit dala phir bhi error
    - pincode dalne pe aage nahi badh raha
    - sahi pincode hai par galat bata raha hai
  - id: personal_details_correction_request
    name: Personal Details Correction Request
    description: 'Caller has filled and saved/submitted the OTR and wants a personal detail fixed generally — parent
      or spouse name, domicile status, basic details filled wrongly in a hurry — and asks whether it can be edited
      or a second OTR made. Use this when the request spans personal fields or the field is not covered by a specific
      sub-category. NOT: name or DOB specifically -> use name_dob_correction_after_submission; father/husband name
      at the entry stage -> use father_husband_name_entry_issue; category -> use category_change_after_form_submission;
      photo or signature -> use photo_signature_amendment; asking which fields are editable at all -> use what_fields_can_be_corrected.'
    cues:
    - personal details galat bhar gayi hain
    - basic details change ho sakti hain kya
    - jaldi me galat bhar diya, sudhar jayega
    - domicile No ho gaya hai galti se
    - mummy papa ka naam theek karwana hai
    - update kar raha hoon par reflect nahi hota
    - dusra OTR banana padega isko theek karne ke liye
  - id: date_of_birth_entry_issue
    name: Date of Birth Entry Issue
    description: 'Caller is entering the date of birth and hits a problem — the field will not take their DOB, wrong
      format, DOB shown differently from the document, or a wrong DOB typed while filling that they want fixed before
      locking. NOT: form already submitted/locked and DOB must be corrected -> use name_dob_correction_after_submission;
      DOB differs between Aadhaar and marksheet -> use name_dob_mismatch_across_documents; DOB refused at login
      -> use login_method_query.'
    cues:
    - date of birth galat aa rahi hai
    - DOB accept nahi kar raha
    - janm tithi kaise bharein
    - DOB ka format kya hai
    - Aadhaar wali DOB aa rahi hai marksheet wali nahi
    - DOB me saal galat pad gaya
    - date of birth field edit nahi ho raha
  - id: gender_nationality_entry_issue
    name: Gender / Nationality Entry Issue
    description: 'Caller is filling gender or nationality and the value is wrong or the choice is not available
      — male picked instead of female, Balak/Balika varg or boys/girls-school option missing or vanished while filling,
      gender field locked. NOT: already submitted and gender must be changed through the correction route -> use
      what_fields_can_be_corrected or personal_details_correction_request; a dropdown generally has no values ->
      use district_state_dropdown_issue.'
    cues:
    - gender galat select ho gaya
    - male ki jagah female ho gaya hai
    - balak balika varg ka option nahi aa raha
    - female ka option hi nahi dikh raha
    - gender field change nahi ho raha
    - nationality me kya bharein
    - option bharte bharte gayab ho gaya
  - id: twin_information_query
    name: Twin Information Query
    description: Caller asks about the twin/sibling declaration field — whether to mark twin, what to enter when
      two siblings have the same date of birth, or how twins apply separately.
    cues:
    - twin ka option kya hai
    - jumwa bachche hain, kya bharein
    - dono ki DOB same hai
    - twin wala column bharna zaroori hai
    - bhai behan dono apply kar rahe hain
    - twin information me yes karna hai kya
    - same date of birth par error aa raha hai
  - id: father_husband_name_entry_issue
    name: Father / Husband Name Entry Issue
    description: 'Caller is entering or has just saved the father''s, mother''s or husband''s name and it is wrong
      or not accepted — spelling/typo, missing space, a dot or initial not allowed, mismatch with Aadhaar — and
      asks how to enter or fix it. NOT: form locked and the caller is asking about the correction-window route for
      these names -> use personal_details_correction_request or name_dob_correction_after_submission; names differ
      between documents for eKYC -> use name_dob_mismatch_across_documents.'
    cues:
    - pita ka naam galat bhar gaya
    - father name me spelling galat hai
    - husband ka naam theek karna hai
    - naam me space nahi aa raha
    - dot accept nahi kar raha naam me
    - Aadhaar me father name alag hai
    - mata ka naam galat pad gaya hai
  - id: mobile_email_change_in_profile
    name: Mobile / Email Change in Profile
    description: 'Caller wants to change or correct the registered mobile number or email in the OTR profile — typo
      in the email, number already registered error, or verification of the new contact failing. NOT: OTP not arriving
      on the existing contact -> use mobile_otp_not_received or email_otp_not_received; OTP going to somebody else''s
      number -> use otp_coming_on_wrong_number; registered number no longer in hand and access is the problem ->
      use registered_mobile_not_accessible.'
    cues:
    - email ID galat ho gayi hai, change karni hai
    - mobile number badalna hai OTR me
    - number already registered bata raha hai
    - email me spelling galat hai
    - naya number update kaise karun
    - email change ka option nahi mil raha
    - mobile verify nahi ho raha naye number par
  - id: marital_status_field_query
    name: Marital Status Field Query
    description: 'Caller asks what to select in the marital status field or says it is not updating/saving — what
      to pick after marriage, whether spouse details become mandatory. NOT: the surname changed after marriage and
      eKYC fails -> use post_marriage_surname_mismatch_in_ekyc; the address to use after marriage -> use permanent_address_entry_issue.'
    cues:
    - marital status me kya bharein
    - shaadi ho gayi hai, married select karun
    - marital status update nahi ho raha
    - unmarried dala tha, ab married karna hai
    - pati ka naam mandatory ho gaya
    - marital status ka option save nahi hota
    - vaivahik sthiti ka column
  - id: preview_and_edit_before_otr_completion
    name: Preview & Edit Before OTR Completion
    description: 'Caller is at the preview/review step before the OTR is finally locked and asks how to go back
      and edit an entry, or is stuck on the review screen and cannot get back to a section. NOT: OTR already locked/submitted
      and now needs editing -> use how_to_edit_saved_otr_data or otr_profile_locked_after_submission; data is missing

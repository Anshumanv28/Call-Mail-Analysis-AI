  - id: unrelated_wrong_call
    name: Unrelated / Wrong Call
    description: 'The call is not about the UP OTR portal at all, or is about an exam/scheme this helpline holds
      no information on (other boards, Super TET vacancies, other departments'' forms), or is a wrong number, blank
      or test call. NOT: the query is in scope but the caller is following up again -> use `repeated_call_follow_up`;
      caller should be routed to a specific office -> use `transfer_to_another_department`; audio unusable and a
      callback is agreed -> use `call_back_request`.'

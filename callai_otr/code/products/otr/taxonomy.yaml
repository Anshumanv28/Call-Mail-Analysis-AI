    - kal bhi call kiya tha
    - mail bheja tha uska kya hua
    - pehle bhi complaint ki thi
    - abhi tak koi jawab nahi aaya
    - dobara call kar raha hun same problem hai
    - mail check kar liya aapne
  - id: complaint_against_portal_process
    name: Complaint Against Portal / Process
    description: 'Caller is lodging a grievance about the portal, the exam process or the helpline itself — wrong
      or invalid helpline number published, unfair rejection of a result or form, system fault causing them loss
      — and asks where and how to register the complaint. NOT: a technical error they want fixed -> use `portal_not_loading_technical_error`;
      only asking for correct numbers/timings -> use `helpline_timing_query`; chasing an earlier call or mail ->
      use `repeated_call_follow_up`.'

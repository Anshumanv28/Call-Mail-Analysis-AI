# One playbook per sub_issue id. The OTR response head reads the matching playbook and
# phrases it for the caller in Hinglish. Keep each playbook to the steps a control-room
# agent would actually say; the model is told not to add anything that is not here.
#
# `default` is used when a sub_issue has no playbook of its own.

default: |
  Acknowledge the issue, confirm the centre code and the exact error or symptom,
  tell the caller a ticket is being raised and a technician will call back within 15 minutes.
  Ask them to keep the phone reachable.

camera_offline: |
  1. Ask which camera number(s) show offline on the portal.
  2. Ask them to check the camera's power adapter and the LAN cable at both ends, then wait 2 minutes.
  3. If still offline, restart the NVR/DVR once.
  4. If not resolved, a ticket is raised and the network technician calls back within 15 minutes.

video_not_visible:
  |
  1. Ask them to refresh the portal page and log in again.
  2. Check whether the camera LED is on; if the LED is off, follow the camera-offline steps.
  3. If the LED is on but no video, restart the NVR/DVR once and wait 3 minutes.
  4. Otherwise a ticket is raised; escalate to the video team.

recording_issue: |
  1. Ask them to open the DVR/NVR screen and check the recording indicator and storage status.
  2. If storage is full, do not delete anything; the recording team will handle it remotely.
  3. Raise a ticket, mark it high priority because recording is mandatory during the exam.

camera_placement: |
  1. Ask them to describe what part of the room the camera does not cover.
  2. Tell them the installation team will adjust it; they should not move the camera themselves.
  3. Raise a ticket with the room and camera number.

no_internet: |
  1. Ask whether the internet is down on all systems or only one.
  2. Ask them to restart the router/dongle once and wait 2 minutes.
  3. Ask them to check the backup connection (second dongle or hotspot) if the centre has one.
  4. If still down, raise a ticket; the network team calls back within 10 minutes.

slow_unstable: |
  1. Ask them to run a speed check on the portal and read the result.
  2. Ask them to switch to the backup connection if available.
  3. Raise a ticket with the speed reading; the network team will monitor the centre.

dongle_router: |
  1. Ask them to check that the SIM is inserted properly and the dongle LED is on.
  2. Ask them to try the dongle on another system.
  3. If the dongle is faulty, raise a ticket for replacement; use the backup connection meanwhile.

server_not_starting: |
  1. Ask them to read the exact error message on the screen.
  2. Ask them to close the application fully and start it again once.
  3. Ask them to confirm the system date and time are correct and the internet is working.
  4. If the same error repeats, raise a ticket; the software team will connect remotely within 10 minutes.

login_failure: |
  1. Ask them to confirm they are using the credentials sent for today's shift.
  2. Ask them to type the password again slowly, checking caps lock.
  3. If an OTP is expected, ask them to wait 2 minutes and check the registered number.
  4. If still failing, raise a ticket; credentials will be reset by the support team.

portal_not_loading: |
  1. Ask them to check the internet first.
  2. Ask them to clear the browser cache or open the portal in a new incognito window.
  3. If it still does not load, raise a ticket; the software team will check the server status.

software_error: |
  1. Ask them to read the exact error message and, if possible, take a photo of the screen.
  2. Ask them to restart the application once.
  3. Raise a ticket with the error text; the software team will call back.

device_not_powering: |
  1. Ask them to check the power cable and the socket, and try another socket.
  2. If a laptop, ask them to hold the power button for 10 seconds and try again.
  3. If it still does not start, raise a ticket for a replacement device.

power_cut: |
  1. Ask whether the UPS or generator is running and how long the backup lasts.
  2. Tell them to keep the server and the network devices on the backup first.
  3. Raise a ticket and inform the centre coordinator.

cable_peripheral: |
  1. Ask which cable or device is faulty.
  2. Ask them to reconnect it or try a spare from the kit.
  3. If no spare, raise a ticket for a replacement.

fingerprint_device: |
  1. Ask them to unplug the device, wait 10 seconds, and plug it into another USB port.
  2. Ask them to clean the sensor with a dry cloth and retry.
  3. If not detected, raise a ticket; the biometric team will connect remotely.

iris_face_device: |
  1. Ask them to check the device connection and lighting in the room.
  2. Ask them to restart the verification application once.
  3. If still failing, raise a ticket for the biometric team.

candidate_data: |
  1. Ask for the roll number or application number of the candidate.
  2. Tell them not to turn the candidate away; use the manual verification process for now.
  3. Raise a ticket; the data team will check the record.

staff_not_reached: |
  1. Ask for the name and role of the missing staff member.
  2. Tell them the coordinator will be informed immediately.
  3. Raise a ticket and share the coordinator's number if requested.

credentials_material: |
  1. Ask exactly what has not been received.
  2. Ask them to check the registered email and SMS once more.
  3. Raise a ticket; the coordinator will arrange delivery or resend the credentials.

schedule_query: |
  Answer from the day's schedule: reporting time, shift timings and gate closing time.
  If unsure, ask them to wait while the coordinator confirms, and call back.

all_fine: |
  Thank them for confirming, note the centre as OK for this check, and tell them to call this
  same number again if anything comes up.

escalation_update: |
  Acknowledge that the technical team is already on it, ask them to stay on that call and keep
  the line free, and tell them to call back here only if nobody responds within 15 minutes.

ph_candidate_scribe: |
  1. Ask which room and how many PH candidates / scribes are involved.
  2. Tell them to seat the candidate and the scribe exactly as the written instruction says, and
     within the camera's view; the invigilator should sit at a small distance, not between them.
  3. If the candidate or the observer objects, inform the centre coordinator; do not change the
     arrangement on your own.

observer_invigilator: |
  1. Ask what the observer or invigilator needs.
  2. Relay the standing instruction if it is a known one; otherwise tell them the coordinator will confirm.
  3. Note the room and the name for the log.

candidate_conduct: |
  1. Ask what happened, which room and which seat.
  2. Tell them to inform the centre superintendent and the observer immediately and not to
     confront the candidate themselves.
  3. Raise an incident entry with the time; the coordinator will call back.

test_call: |
  Confirm the line is clear and that this is the control-room number, and ask if there is any issue.

other_issue: |
  Listen, summarise the issue back to the caller, and raise a ticket for the coordinator.

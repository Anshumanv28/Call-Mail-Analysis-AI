# OTR resolution groups — consolidation map over products/otr/taxonomy.yaml (196 sub_issues + not_classified).
# A group = sub-categories a helpline agent resolves with the same answer/action AND that two careful
# readers of one transcript could reasonably pick between. Groups never cross an issue (category).
# Evidence: data/otr/confusion_groups.json (confusable pairs only), labeller2 notes, Gemini summaries.
groups:

# ---------------------------------------------------------------- registration_and_portal
- id: otr_scope_and_reuse
  name: Do I need a new OTR / one OTR for several forms
  why: all answered by the OTR-vs-application rule (one OTR per exam cycle, separate application per post/level)
  members: [fresh_registration_query, duplicate_registration_concern, otr_vs_exam_application_confusion,
            multiple_otr_accounts_issue, how_to_apply_for_exam_after_otr, both_papers_application_query]

- id: offline_application_query
  name: Offline application query
  why: distinct answer (online only); not confusable with other registration labels
  members: [offline_application_query]

- id: site_access_technical
  name: Portal / page not loading or link missing
  why: cannot reach or render the portal; fixed by cache/browser/retry-later or screenshot to support
  members: [portal_not_loading_technical_error, captcha_not_loading_unclear, session_timeout_issue,
            login_with_new_device_issue, apply_otr_link_not_visible_on_portal]

- id: form_save_submit_error
  name: Form stuck - section not saving / submit failing
  why: mid-form technical failure on save or final submit; same retry / clear-cache / email-screenshot action
  members: [registration_form_submission_error, otr_final_submit_button_issue, application_form_section_not_saving,
            complete_otr_profile_step_query, resume_incomplete_application]

- id: confirmation_not_received
  name: OTR ID / confirmation not received
  why: no SMS/email/ID after a submission; agent checks status on portal and has caller mail support
  members: [otr_id_not_received_after_registration, registration_confirmation_not_received,
            otr_submission_confirmation_not_received, amendment_confirmation_not_received]

- id: otp_not_received
  name: OTP not received / not working
  why: OTP delivery or validity failure on mobile or email; resend, wait, network, email support
  members: [mobile_otp_not_received, email_otp_not_received, otp_expired_before_use,
            wrong_otp_entered_multiple_times, otp_login_not_working]

- id: login_credentials_recovery
  name: Forgot password / OTR ID / how to log in
  why: all resolved by the forgot-password / forgot-OTR-ID / OTP-login route
  members: [password_forgotten_reset, account_recovery_query, otr_id_forgotten_recovery, login_method_query]

- id: login_blocked
  name: Account locked after failed attempts
  why: temporary lockout; wait-and-retry or reset, distinct from a forgotten credential
  members: [account_locked_blocked, too_many_failed_login_attempts]

- id: registered_contact_change
  name: Change registered mobile / email
  why: caller cannot receive OTP on, or wants to change, the registered contact; same change-contact procedure
  members: [otp_coming_on_wrong_number, registered_mobile_not_accessible, mobile_email_change_in_profile]

- id: address_field_entry
  name: Address / district / village / pincode entry
  why: data-entry problems in the address block while filling; pick nearest option or mail screenshot
  members: [permanent_address_entry_issue, correspondence_address_entry_issue, district_state_dropdown_issue,
            village_ward_tehsil_not_found, pincode_not_accepted]

- id: locked_basic_details_correction
  name: Name / DOB / father name / gender wrong in locked OTR
  why: basic (identity) details cannot be edited after lock; answer is a fresh OTR with another ID proof
  members: [name_dob_correction_after_submission, date_of_birth_entry_issue, father_husband_name_entry_issue,
            gender_nationality_entry_issue]

- id: locked_form_correction
  name: Correcting a locked OTR / application (non-basic fields)
  why: all resolved by the amendment window and its rules - when it opens, what it allows, how to use it
  members: [what_fields_can_be_corrected, amendment_process_step_by_step_query, amendment_window_opening_date_query,
            correction_window_already_closed, how_to_edit_saved_otr_data, otr_profile_locked_after_submission,
            personal_details_correction_request, category_change_after_form_submission,
            category_correction_after_submission, subject_paper_change_after_submission,
            address_correction_after_submission, wrong_exam_level_selected_primary_vs_junior,
            preview_and_edit_before_otr_completion, photo_signature_amendment]

- id: form_print_pdf_issue
  name: Printed / downloaded form incomplete or wrong
  why: final PDF missing a section or not reflecting data; clear cache, re-download, mail screenshot
  members: [print_download_otr_form, preview_section_data_missing_or_wrong]

- id: twin_information_query
  name: Twin field query
  why: single field explanation; not confusable with other labels
  members: [twin_information_query]

- id: marital_status_field_query
  name: Marital status field query
  why: single field explanation; not confusable with other labels
  members: [marital_status_field_query]

- id: practising_government_teacher_details_entry
  name: In-service teacher details section
  why: exam-application-specific section (HRMS, joining date); refer to advertisement / Aayog
  members: [practising_government_teacher_details_entry]

- id: exam_centre_preference_entry
  name: Exam centre / school preference entry
  why: application-form preference field; distinct field, distinct answer
  members: [exam_centre_preference_entry]

- id: form_cancellation_withdrawal_request
  name: Cancel / withdraw a form
  why: distinct action (no cancellation; leave unpaid / file afresh)
  members: [form_cancellation_withdrawal_request]

